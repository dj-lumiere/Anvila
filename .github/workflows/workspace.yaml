name: Workspace build and test

# The build and test every workspace repository runs (Anvila, Ingrid, RazorForge, Suflae): the four are
# checked out side by side, Ingrid's native runtime is built, and both language test projects run on
# Linux, Windows and macOS. Each repository's own CI calls this workflow; the repository that triggered it
# is tested at its commit against master of the others.

on:
  workflow_call:
    inputs:
      sonar-project:
        description: SonarQube project key to analyze the calling repository under ('' skips the analysis).
        type: string
        default: ''

env:
  # Safety net for a vendored subproject whose own CMakeLists declares cmake_minimum_required < 3.5, which
  # CMake 4.x refuses outright. This is CMake's own escape hatch; honored as an env var by CMake >= 4 and
  # ignored by older CMakes.
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'
  RF_TESTS: RazorForge/tests/RazorForge.Tests.csproj
  SF_TESTS: Suflae/tests/Suflae.Tests.csproj

jobs:
  # Two parallel Linux legs share one definition: `test` is the plain build + test gate, `sonar` repeats it
  # under the SonarScanner (Roslyn-instrumented build, coverage-collecting test run, upload) so the analysis
  # never sits on the test gate's critical path.
  build-linux:
    name: build-linux (${{ matrix.leg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(inputs.sonar-project != '' && '["test", "sonar"]' || '["test"]') }}

    steps:
      - name: Checkout the workspace
        uses: dj-lumiere/Anvila/.github/actions/checkout-workspace@master

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config autoconf automake libtool \
            python3 curl wget ca-certificates lsb-release software-properties-common gnupg

      - name: Install LLVM 22 toolchain
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 22
          # LLVMSharp talks to the in-process LLVM C library, but the builder shells out to `clang` and `opt`
          # for the final codegen/link step. Make the version-suffixed binaries resolvable without the suffix.
          sudo ln -sf /usr/bin/clang-22 /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-22 /usr/local/bin/clang++
          sudo ln -sf /usr/bin/opt-22 /usr/local/bin/opt
          sudo ln -sf /usr/bin/llc-22 /usr/local/bin/llc
          sudo ln -sf /usr/bin/llvm-ar-22 /usr/local/bin/llvm-ar
          sudo ln -sf /usr/bin/lld-22 /usr/local/bin/lld
          sudo ln -sf /usr/bin/ld.lld-22 /usr/local/bin/ld.lld
          clang --version
          opt --version

      - name: Build native libraries
        run: |
          cd Ingrid/native
          chmod +x build.sh
          # Clang 16+ promoted -Wimplicit-function-declaration to an error by default. The vendored libuv
          # brings its own CMakeLists.txt, for which the per-target flags in cmake/*.cmake don't apply, so
          # blanket the build with the flag as a safety net, paired with _GNU_SOURCE so glibc exposes the
          # full POSIX surface (lseek, mlock, ftruncate, etc.).
          export CC=clang
          export CXX=clang++
          export CFLAGS="-D_GNU_SOURCE -Wno-implicit-function-declaration"
          export CXXFLAGS="-D_GNU_SOURCE -Wno-implicit-function-declaration"
          ./build.sh

      # SonarQube lives inside the tailnet; join it as an ephemeral node so the hosted runner can reach
      # SONAR_HOST_URL. Requires a Tailscale OAuth client (scope: auth_keys) and an ACL tag `tag:ci`.
      - name: Connect to tailnet for SonarQube
        if: matrix.leg == 'sonar'
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Install SonarScanner for .NET
        if: matrix.leg == 'sonar'
        run: |
          dotnet tool install --global dotnet-sonarscanner
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Restore dependencies
        run: |
          dotnet restore "$RF_TESTS"
          dotnet restore "$SF_TESTS"

      # The scanner sees every project the build compiles, so the other workspace repositories are excluded:
      # each repository is analyzed under its own project key.
      - name: SonarQube Begin
        if: matrix.leg == 'sonar'
        run: |
          own="${GITHUB_REPOSITORY#*/}"
          exclusions=""
          for p in Anvila Ingrid RazorForge Suflae; do
            if [ "$p" != "$own" ]; then exclusions="${exclusions:+$exclusions,}$p/**"; fi
          done
          dotnet sonarscanner begin \
            /k:"${{ inputs.sonar-project }}" \
            /d:sonar.host.url="${{ secrets.SONAR_HOST_URL }}" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.exclusions="$exclusions" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"

      - name: Build
        run: |
          dotnet build "$RF_TESTS" --configuration Release --no-restore
          dotnet build "$SF_TESTS" --configuration Release --no-restore

      - name: Test
        if: matrix.leg == 'test'
        run: |
          dotnet test "$RF_TESTS" --configuration Release --no-build --verbosity normal
          dotnet test "$SF_TESTS" --configuration Release --no-build --verbosity normal

      - name: Test with coverage
        if: matrix.leg == 'sonar'
        run: |
          for t in "$RF_TESTS" "$SF_TESTS"; do
            dotnet test "$t" --configuration Release --no-build --verbosity normal \
              --collect:"XPlat Code Coverage" \
              -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
          done

      - name: SonarQube End
        if: always() && matrix.leg == 'sonar'
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout the workspace
        uses: dj-lumiere/Anvila/.github/actions/checkout-workspace@master

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The hosted image ships an LLVM, but not necessarily 22.x, and the builder needs the full tool set
      # (clang/opt/llc/lld) — use the official clang+llvm release archive, which includes everything, and
      # cache it.
      - name: Cache LLVM 22 toolchain
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: C:\llvm22
          key: llvm-22.1.7-win64

      - name: Download LLVM 22 toolchain
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          curl.exe -L -o llvm.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.7/clang+llvm-22.1.7-x86_64-pc-windows-msvc.tar.xz"
          if ($LASTEXITCODE -ne 0) { throw 'LLVM download failed' }
          New-Item -ItemType Directory -Force C:\llvm22 | Out-Null
          tar -xf llvm.tar.xz -C C:\llvm22 --strip-components=1
          if ($LASTEXITCODE -ne 0) { throw 'LLVM extract failed' }
          Remove-Item llvm.tar.xz

      - name: Install Ninja and put LLVM on PATH
        shell: pwsh
        run: |
          choco install ninja -y
          Add-Content $env:GITHUB_PATH 'C:\llvm22\bin'

      - name: Verify toolchain
        shell: pwsh
        run: |
          clang --version
          opt --version
          ninja --version

      # Ingrid\native\build.bat runs automatically via the Anvila csproj BuildNativeLibraries target.
      - name: Build
        shell: pwsh
        run: |
          dotnet build $env:RF_TESTS --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build $env:SF_TESTS --configuration Release

      - name: Test
        shell: pwsh
        run: |
          dotnet test $env:RF_TESTS --configuration Release --no-build --verbosity normal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test $env:SF_TESTS --configuration Release --no-build --verbosity normal

  build-macos:
    runs-on: macos-15

    steps:
      - name: Checkout the workspace
        uses: dj-lumiere/Anvila/.github/actions/checkout-workspace@master

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install LLVM 22 toolchain
        run: |
          # `llvm` is the current stable (22.x); keg-only, and GITHUB_PATH entries are prepended, so this
          # shadows Apple clang.
          brew install llvm ninja
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: |
          clang --version
          opt --version

      - name: Build native libraries
        run: |
          cd Ingrid/native
          chmod +x build.sh
          export CC=clang
          export CXX=clang++
          ./build.sh

      - name: Build
        run: |
          dotnet build "$RF_TESTS" --configuration Release
          dotnet build "$SF_TESTS" --configuration Release

      - name: Test
        run: |
          dotnet test "$RF_TESTS" --configuration Release --no-build --verbosity normal
          dotnet test "$SF_TESTS" --configuration Release --no-build --verbosity normal

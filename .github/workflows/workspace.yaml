name: Workspace build and test

# The build and test every workspace repository runs (Anvila, Ingrid, Revare, Mielia): the four are
# checked out side by side, Ingrid's native runtime is built, and both language test projects run on
# Linux, Windows and macOS. Each repository's own CI calls this workflow; the repository that triggered it
# is tested at its commit against master of the others.

on:
  workflow_call:

env:
  # Safety net for a vendored subproject whose own CMakeLists declares cmake_minimum_required < 3.5, which
  # CMake 4.x refuses outright. This is CMake's own escape hatch; honored as an env var by CMake >= 4 and
  # ignored by older CMakes.
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'
  RV_TESTS: Revare/tests/Revare.Tests.csproj
  MI_TESTS: Mielia/tests/Mielia.Tests.csproj
  # Tests that assert a wall-clock bound carry the Timing category: the numbers depend on the runner and on what
  # runs beside them, so CI leaves them out. A local `dotnet test` runs them.
  TEST_FILTER: Category!=Timing
  # The tests' limits on a child process (a build, a built program) catch hangs. A hosted runner builds the stdlib
  # bundle in 2 to 4.5 minutes, near the 5-minute base limit, so the limits are doubled here (TestHelpers.ChildTimeoutMs).
  RV_TEST_TIMEOUT_SCALE: '2'

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    # A hang fails the job here instead of holding the runner for GitHub's six hours.
    timeout-minutes: 120

    steps:
      - name: Checkout the workspace
        uses: dj-lumiere/Anvila/.github/actions/checkout-workspace@master

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config autoconf automake libtool \
            python3 curl wget ca-certificates lsb-release software-properties-common gnupg gdb

      - name: Install LLVM 22 toolchain
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 22
          # LLVMSharp talks to the in-process LLVM C library, but the builder shells out to LLVM's tools
          # (clang, opt, llvm-link) by their bare names. apt.llvm.org puts the unsuffixed set in
          # /usr/lib/llvm-22/bin, so that directory goes first on PATH and every tool comes from the one install.
          echo /usr/lib/llvm-22/bin >> "$GITHUB_PATH"
          /usr/lib/llvm-22/bin/clang --version
          /usr/lib/llvm-22/bin/opt --version
          /usr/lib/llvm-22/bin/llvm-link --version

      - name: Build native libraries
        run: |
          # Ingrid's runtime has code written in Lapila (Ingrid/runtime-lapila), compiled by the Lapila builder.
          dotnet build Lapila/Lapila.csproj --configuration Release
          export LAPILA_DLL="$GITHUB_WORKSPACE/Lapila/bin/Release/net10.0/lapila.dll"
          cd Ingrid/native
          chmod +x build.sh
          # _GNU_SOURCE so glibc exposes the full POSIX surface; -Wno-implicit-function-declaration as a safety
          # net (Clang 16+ made it an error by default).
          export CC=clang
          export CXX=clang++
          export CFLAGS="-D_GNU_SOURCE -Wno-implicit-function-declaration"
          export CXXFLAGS="-D_GNU_SOURCE -Wno-implicit-function-declaration"
          ./build.sh

      - name: Restore dependencies
        run: |
          dotnet restore "$RV_TESTS"
          dotnet restore "$MI_TESTS"

      - name: Build
        run: |
          dotnet build "$RV_TESTS" --configuration Release --no-restore
          dotnet build "$MI_TESTS" --configuration Release --no-restore

      # A test that gives up on a hung child takes its thread stacks first (HangDiagnostics in the test
      # projects): dotnet-stack for the builder, gdb for a native child, which needs ptrace to reach a
      # process that is not its own child.
      - name: Install hang diagnostics
        run: |
          dotnet tool install --global dotnet-stack
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH
          sudo sysctl -w kernel.yama.ptrace_scope=0

      - name: Test
        run: |
          dotnet test "$RV_TESTS" --configuration Release --no-build --verbosity normal --filter "$TEST_FILTER"
          dotnet test "$MI_TESTS" --configuration Release --no-build --verbosity normal --filter "$TEST_FILTER"

  build-windows:
    runs-on: windows-latest
    # A hang fails the job here instead of holding the runner for GitHub's six hours.
    timeout-minutes: 120

    steps:
      - name: Checkout the workspace
        uses: dj-lumiere/Anvila/.github/actions/checkout-workspace@master

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The hosted image ships an LLVM, but not necessarily 22.x, and the builder needs the full tool set
      # (clang/opt/llc/lld) — use the official clang+llvm release archive, which includes everything, and
      # cache it.
      - name: Cache LLVM 22 toolchain
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: C:\llvm22
          key: llvm-22.1.7-win64

      - name: Download LLVM 22 toolchain
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          curl.exe -L -o llvm.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.7/clang+llvm-22.1.7-x86_64-pc-windows-msvc.tar.xz"
          if ($LASTEXITCODE -ne 0) { throw 'LLVM download failed' }
          New-Item -ItemType Directory -Force C:\llvm22 | Out-Null
          tar -xf llvm.tar.xz -C C:\llvm22 --strip-components=1
          if ($LASTEXITCODE -ne 0) { throw 'LLVM extract failed' }
          Remove-Item llvm.tar.xz

      - name: Install Ninja and put LLVM on PATH
        shell: pwsh
        run: |
          choco install ninja -y
          Add-Content $env:GITHUB_PATH 'C:\llvm22\bin'

      - name: Verify toolchain
        shell: pwsh
        run: |
          clang --version
          opt --version
          ninja --version

      # Ingrid\native\build.bat runs automatically via the Anvila csproj BuildNativeLibraries target.
      - name: Build
        shell: pwsh
        run: |
          dotnet build $env:RV_TESTS --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build $env:MI_TESTS --configuration Release

      - name: Install hang diagnostics
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-stack
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.dotnet\tools"

      - name: Test
        shell: pwsh
        run: |
          dotnet test $env:RV_TESTS --configuration Release --no-build --verbosity normal --filter $env:TEST_FILTER
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test $env:MI_TESTS --configuration Release --no-build --verbosity normal --filter $env:TEST_FILTER

  build-macos:
    runs-on: macos-15
    # A hang fails the job here instead of holding the runner for GitHub's six hours.
    timeout-minutes: 120

    steps:
      - name: Checkout the workspace
        uses: dj-lumiere/Anvila/.github/actions/checkout-workspace@master

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install LLVM 22 toolchain
        run: |
          # `llvm` is the current stable (22.x); keg-only, and GITHUB_PATH entries are prepended, so this
          # shadows Apple clang.
          brew install llvm ninja
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: |
          clang --version
          opt --version

      - name: Build native libraries
        run: |
          # Ingrid's runtime has code written in Lapila (Ingrid/runtime-lapila), compiled by the Lapila builder.
          dotnet build Lapila/Lapila.csproj --configuration Release
          export LAPILA_DLL="$GITHUB_WORKSPACE/Lapila/bin/Release/net10.0/lapila.dll"
          cd Ingrid/native
          chmod +x build.sh
          export CC=clang
          export CXX=clang++
          ./build.sh

      - name: Build
        run: |
          dotnet build "$RV_TESTS" --configuration Release
          dotnet build "$MI_TESTS" --configuration Release

      - name: Install hang diagnostics
        run: |
          dotnet tool install --global dotnet-stack
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Test
        run: |
          dotnet test "$RV_TESTS" --configuration Release --no-build --verbosity normal --filter "$TEST_FILTER"
          dotnet test "$MI_TESTS" --configuration Release --no-build --verbosity normal --filter "$TEST_FILTER"

name: Checkout the LumiFoundry workspace
description: >
  Checks out Anvila, Ingrid, Revare, Mielia and Lapila side by side under the workspace root, the layout
  their project references (..\Anvila, ..\Ingrid, ..\Lapila) expect.
  The repository that triggered the run is checked out at its own commit, every other one at master.

runs:
  using: composite
  steps:
    - name: Checkout Anvila
      uses: actions/checkout@v4
      with:
        repository: dj-lumiere/Anvila
        path: Anvila
        ref: ${{ github.repository == 'dj-lumiere/Anvila' && github.sha || 'master' }}
        fetch-depth: ${{ github.repository == 'dj-lumiere/Anvila' && '0' || '1' }}

    - name: Checkout Ingrid
      uses: actions/checkout@v4
      with:
        repository: dj-lumiere/Ingrid
        path: Ingrid
        ref: ${{ github.repository == 'dj-lumiere/Ingrid' && github.sha || 'master' }}
        fetch-depth: ${{ github.repository == 'dj-lumiere/Ingrid' && '0' || '1' }}

    - name: Checkout Revare
      uses: actions/checkout@v4
      with:
        repository: dj-lumiere/Revare
        path: Revare
        ref: ${{ github.repository == 'dj-lumiere/Revare' && github.sha || 'master' }}
        fetch-depth: ${{ github.repository == 'dj-lumiere/Revare' && '0' || '1' }}

    - name: Checkout Mielia
      uses: actions/checkout@v4
      with:
        repository: dj-lumiere/Mielia
        path: Mielia
        ref: ${{ github.repository == 'dj-lumiere/Mielia' && github.sha || 'master' }}
        fetch-depth: ${{ github.repository == 'dj-lumiere/Mielia' && '0' || '1' }}

    - name: Checkout Lapila
      uses: actions/checkout@v4
      with:
        repository: dj-lumiere/Lapila
        path: Lapila
        ref: ${{ github.repository == 'dj-lumiere/Lapila' && github.sha || 'master' }}
        fetch-depth: ${{ github.repository == 'dj-lumiere/Lapila' && '0' || '1' }}

name: Checkout the LumiFoundry workspace
description: >
  Checks out Anvila, Ingrid, RazorForge and Suflae side by side under the workspace root, the layout their
  project references (..\Anvila, ..\Ingrid) expect, and fetches the native library sources Ingrid builds.
  The repository that triggered the run is checked out at its own commit, every other one at master.

runs:
  using: composite
  steps:
    - name: Checkout Anvila
      uses: actions/checkout@v4
      with:
        repository: dj-lumiere/Anvila
        path: Anvila
        ref: ${{ github.repository == 'dj-lumiere/Anvila' && github.sha || 'master' }}
        fetch-depth: ${{ github.repository == 'dj-lumiere/Anvila' && '0' || '1' }}

    - name: Checkout Ingrid
      uses: actions/checkout@v4
      with:
        repository: dj-lumiere/Ingrid
        path: Ingrid
        ref: ${{ github.repository == 'dj-lumiere/Ingrid' && github.sha || 'master' }}
        fetch-depth: ${{ github.repository == 'dj-lumiere/Ingrid' && '0' || '1' }}

    - name: Checkout RazorForge
      uses: actions/checkout@v4
      with:
        repository: dj-lumiere/RazorForge
        path: RazorForge
        ref: ${{ github.repository == 'dj-lumiere/RazorForge' && github.sha || 'master' }}
        fetch-depth: ${{ github.repository == 'dj-lumiere/RazorForge' && '0' || '1' }}

    - name: Checkout Suflae
      uses: actions/checkout@v4
      with:
        repository: dj-lumiere/Suflae
        path: Suflae
        ref: ${{ github.repository == 'dj-lumiere/Suflae' && github.sha || 'master' }}
        fetch-depth: ${{ github.repository == 'dj-lumiere/Suflae' && '0' || '1' }}

    - name: Fetch native library sources (libuv, libco)
      shell: bash
      run: |
        cd Ingrid/native
        git clone --depth 1 https://github.com/libuv/libuv.git libuv
        git clone --depth 1 https://github.com/higan-emu/libco.git libco
